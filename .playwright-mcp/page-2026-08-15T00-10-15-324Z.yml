            - paragraph [ref=f189e112]: America's Leading Non-Alcoholic Brewer Named a Proud Non-Alcoholic Beer Partner of MetLife Stadium, the New York Jets, and the New York Giants
            - paragraph [ref=f189e113]:
              - text: MILFORD, Conn. and SAN DIEGO, Aug. 11, 2026 /PRNewswire/ --
              - link "Athletic Brewing Company" [ref=f189e114] [cursor=pointer]:
                - /url: https://edge.prnewswire.com/c/link/?t=0&l=en&o=4750037-1&h=1941010416&u=https%3A%2F%2Fathleticbrewing.com%2F&a=Athletic+Brewing+Company
              - text: ", America's largest dedicated non-alcoholic brewer, today announced a new multi-year agreement with MetLife Stadium, one of the country's premier sports and entertainment venues."
            - paragraph [ref=f189e115]: Under the agreement, Athletic Brewing will become a Proud Non-Alcoholic Beer Partner of MetLife Stadium, the New York Giants, and the New York Jets.
            - paragraph [ref=f189e116]: The arrival of Athletic Brewing's award-winning non-alcoholic beer at MetLife Stadium, alongside the New York Jets and the New York Giants, represents a first-of-its-kind milestone for all four organizations. It marks Athletic Brewing's first formal sponsorship of two professional football teams and a professional football stadium, a major step in the company's mission to elevate the modern fan experience by bringing great-tasting non-alcoholic beer to more people across more occasions. It is also the first time MetLife Stadium and its two home teams have aligned with a dedicated non-alcoholic brewer in this capacity.
            - paragraph [ref=f189e117]: "\"We're thrilled to team up with MetLife Stadium, the New York Giants, and the New York Jets to bring Athletic's great-tasting brews to one of the most exciting venues in sports and entertainment,\" said Bill Shufelt, Co-Founder and CEO of Athletic Brewing Company. \"This is an exciting step forward in our mission to revolutionize the way the world drinks and make modern moderation more accessible. We can't wait for Athletic to become the game day ritual fans count on, from the tailgate to the final whistle.\""
            - paragraph [ref=f189e118]:
              - text: As part of the agreement, fans can enjoy 19.2 oz. cans of
              - link "Run Wild IPA" [ref=f189e119] [cursor=pointer]:
                - /url: https://edge.prnewswire.com/c/link/?t=0&l=en&o=4750037-1&h=3168494381&u=https%3A%2F%2Fathleticbrewing.com%2Fproducts%2Frun-wild&a=Run+Wild+IPA
              - text: and
              - link "Upside Dawn Golden" [ref=f189e120] [cursor=pointer]:
                - /url: https://edge.prnewswire.com/c/link/?t=0&l=en&o=4750037-1&h=3751734214&u=https%3A%2F%2Fathleticbrewing.com%2Fproducts%2Fupside-dawn&a=Upside+Dawn+Golden
              - text: at locations throughout MetLife Stadium.
            - paragraph [ref=f189e121]: Athletic will also be integrated throughout the game day and live entertainment experience through video board content and interactive fan promotions. Fans will also see Athletic branding across prominent stadium placements, including concourse displays, pylons, LED displays, menus, retail kiosks, and digital highway signage near the Stadium.
            - paragraph [ref=f189e122]: During the season and beyond, guests will see Athletic integrated across MetLife Stadium and New York Jets and New York Giants media platforms. On select game days, fans can discover Athletic's award-winning flavor firsthand through product sampling and interactive activations.
            - paragraph [ref=f189e123]: "\"Delivering an exceptional experience for every guest is our highest priority at MetLife Stadium,\" said Ron VanDeVeen, President & CEO, MetLife Stadium. \"As the live event experience continues to evolve, we are committed to offering amenities that reflect the preferences of all guests. Partnering with a non-alcoholic brewing pioneer like Athletic allows us to broaden our beverage offerings, provide greater choice, and further shape the experience for all guests who visit MetLife Stadium throughout the year.\""
            - paragraph [ref=f189e124]: Athletic will reach fans beyond the stadium across New York Giants and New York Jets television, radio, digital, social media, and fan-engagement platforms. Athletic will also participate in both teams' training camps, community initiatives, and select events, creating additional opportunities to connect with fans throughout the season and across the New York metropolitan area.
            - paragraph [ref=f189e125]: Later this year, Athletic Brewing plans to release special-edition packaging celebrating the New York Jets and New York Giants. Football fans in the Tri-State area will be able to purchase 12-packs of Run Wild IPA featuring the New York Giants logo and 12-packs of Upside Dawn Golden bearing the New York Jets logo.
            - paragraph [ref=f189e126]: The sponsorship further reinforces Athletic's leadership across the sports and entertainment landscape, bringing its non-alcoholic beer to more fans and more of the moments that matter. Athletic is already served at more than 200 venues nationwide, and the company maintains major partnerships spanning professional soccer, baseball, lacrosse, hockey, college athletics, endurance events, outdoor sports, and live music.
            - paragraph [ref=f189e127]:
              - text: Founded by Bill Shufelt and John Walker, Athletic pioneered a proprietary method for making non-alcoholic beer, re-engineering nearly every step of the brewing process through hundreds of small-batch trials. This innovative approach has made Athletic the most highly awarded non-alcoholic brewer of the past decade, with more than 200 prestigious taste awards. The company produces nearly 50 NA beers annually and is the best-selling NA craft beer brand in the U.S., with over 50% market share — outselling the next 100 NA craft brands combined and leading its closest competitor by 44 share points
              - superscript [ref=f189e128]: "1"
              - text: .
