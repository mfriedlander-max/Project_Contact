            - paragraph [ref=f189e139]: About Athletic Brewing Company
            - paragraph [ref=f189e140]:
              - text: Athletic Brewing Company is America's largest dedicated non-alcoholic brewer. Athletic is revolutionizing how modern adults drink by crafting full-flavored NA brews that can be enjoyed anytime and anywhere. Launched commercially in 2018, Athletic is the number one non-alcoholic beer brand in America
              - superscript [ref=f189e141]: "2"
              - text: and a top 15 U.S. brewing company
              - superscript [ref=f189e142]: "3"
              - text: . Its award-winning brews are available nationwide at over 75,000 retail locations. Athletic operates custom breweries in Connecticut and California and donates up to $2 million annually to protecting and restoring outdoor spaces across the globe via its Two For The Trails program. Athletic is proudly a Certified B Corporation™. Learn more and shop at
              - link "www.athleticbrewing.com" [ref=f189e143] [cursor=pointer]:
