            - paragraph [ref=f189e158]:
              - link "About MetLife Stadium" [ref=f189e159] [cursor=pointer]:
                - /url: https://edge.prnewswire.com/c/link/?t=0&l=en&o=4750037-1&h=3499769107&u=http%3A%2F%2Fwww.metlifestadium.com%2F&a=About+MetLife+Stadium+
            - paragraph [ref=f189e160]: MetLife Stadium, located in East Rutherford, NJ, is the home of the New York Giants and New York Jets and has the largest seating capacity in the NFL (82,500). The venue is one of the busiest stadiums in the world and ranked No. 1 in the U.S. for both tickets sold and ticket revenue in 2024 per Pollstar. MetLife Stadium was named "Highest Grossing Stadium of the Year" nine times by Billboard and "Venue of the Year" by StadiumBusiness. In 2021, MetLife Stadium became the first NFL Stadium to join the UN Framework Convention on Climate Change's Sports for Climate Action Framework, which aims to achieve global greenhouse gas (GHG) emissions reductions goals. In 2026, MetLife Stadium became officially LEED Gold Certified, marking operational excellence across energy efficiency, water conservation, waste management, indoor environmental quality, and sustainable transportation practices.
            - paragraph [ref=f189e161]: About the New York Giants
            - paragraph [ref=f189e162]:
              - text: "A cornerstone franchise of the National Football League, the New York Football Giants began play in 1925. The Giants have won eight championships: 1927, 1934, 1938, 1956, 1986, 1990, 2007 and 2011. After winning two titles in five years, the Giants are the only NFL franchise with Super Bowl victories in four consecutive decades. Headquartered at the Quest Diagnostics Training Center in East Rutherford, N.J., the Giants enter their 102nd season of play this fall. For more information, visit"
              - link "www.giants.com" [ref=f189e163] [cursor=pointer]:
                - /url: https://edge.prnewswire.com/c/link/?t=0&l=en&o=4750037-1&h=2424168587&u=http%3A%2F%2Fwww.giants.com%2F&a=www.giants.com
              - text: .
            - paragraph [ref=f189e164]: About the New York Jets
            - paragraph [ref=f189e165]: The New York Jets were founded in 1959 as the New York Titans and served as a charter member of the American Football League. Following the 1968 season, the team made history by becoming the first AFL franchise to win a world championship, defeating the Baltimore Colts in Super Bowl III—a victory widely credited with validating the AFL ahead of its 1970 merger with the NFL. Today, as one of the league's flagship franchises in the nation's largest media market, the Jets represent the sport on one of its biggest global stages.
            - paragraph [ref=f189e166]: The Jets enhance the fan experience through innovation and storytelling, including 1JD Entertainment, a digital content platform that connects fans across social and digital channels. The organization is also committed to community impact, supporting youth football, girls' and women's flag football, and programs serving disadvantaged communities throughout the tri-state area.
            - paragraph [ref=f189e167]: The Jets play at MetLife Stadium - one of the world's most successful multi use venues - and are headquartered at the Atlantic Health Jets Training Center in Florham Park, New Jersey.
            - paragraph [ref=f189e168]: SOURCE Athletic Brewing Company
