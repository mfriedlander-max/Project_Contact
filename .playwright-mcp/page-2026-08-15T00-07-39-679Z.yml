                - generic [ref=e131]:
                  - heading "In this episode:" [level=4] [ref=e132]
                  - generic [ref=e133]:
                    - paragraph [ref=e134]: Athletic Brewing co-founder and CEO Bill Shufelt is “the most excited” he’s felt since founding the dedicated non-alcoholic (NA) beer brand.
                    - paragraph [ref=e135]: On the latest edition of the Brewbound Podcast, Shufelt shared what’s driving his hyped feeling, with a foundation he and co-founder John Walker laid about a decade ago. That foundation is built on a team of 300 co-workers, bicoastal brewing facilities, a strong distribution base for its core beers, a slate of new products hitting retailers and marketing campaigns beginning to ramp up.
                    - paragraph [ref=e136]: “I’m very bullish on the long-term health and growth of the category and our part in growing that,” Shufelt said. “It was very hard to get non-alcoholic beer from zero to 2% of beer, but there are actual retailers in the U.S. [where] non-alcoholic beer is touching up against 20% of their beer sales.”
                    - paragraph [ref=e137]: Those retailers lend credence to Shufelt’s belief that NA beer can be a much bigger part of the beer category. Shufelt explained that consumers are very early in the NA beer discovery curve, with the vast majority unaware how the product has changed in the last decade.
                    - paragraph [ref=e138]: Even with the stage set for growth, Shufelt acknowledged that Athletic still has work to do for the company and the segment to reach some of his loftier goals.
                    - paragraph [ref=e139]: For Athletic in particular, which holds around 22% of the NA beer segment, distribution remains its biggest opportunity.
                    - paragraph [ref=e140]: “In independents, no matter how much our distributors smile at us and tell us we’re a priority, we’re in like 10% of their independents,” Shufelt said. “And I can go into stores in almost any state in the country and look at a shelf that is controlled by our distributor that has five-plus non-alcoholic beer products on it, and Athletic will have none. There’s just such untapped distribution out there still.”
                    - paragraph [ref=e141]: For now, Shufelt is focused on driving Athletic and NA beer forward. But could the future include an IPO? An Athletic led by someone else? Shufelt said it’s possible, but he doesn't want to be on the outside looking in on an opportunity he was one of the few people to see.
                    - paragraph [ref=e142]: Before the interview, Justin, Jess and Zoe discuss the latest headlines, including the mixed results craft brewers are seeing from the World Cup, the American Cider Association co-locating its 2027 CiderCon conference with the Brewers Association’s Craft Brewers Conference, the closure of Nebraska’s largest craft brewery and the top new products of so far this year.
