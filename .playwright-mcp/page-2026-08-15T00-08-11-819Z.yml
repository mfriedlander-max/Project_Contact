                    - paragraph [ref=f20e379]:
                      - text: Steven Bertoni is an assistant managing editor who runs the Forbes Founders team, where he oversees coverage of top entrepreneurs and the Forbes 30 Under 30 and Top Creators franchises. He joined Forbes in 2008 and works in New York. Bertoni helped launch the Forbes Under 30 list in 2011 and is the founder of the Forbes Top Creator list. He has written more than 15 Forbes cover stories on companies including Facebook, Spotify, Instagram, PayPal, and the comeback of the Twinkie. His profile on Facebook's Sean Parker won the SABEW award for Best Business Feature in 2011. In 2021, Business Insider named Bertoni as one of its “Most Influential Financial Journalists to Know.” Earlier in his career, Bertoni worked on the Forbes Wealth Team, edited the magazine's front of book section, and launched the flagship podcast "The Forbes Interview." Bertoni earned an MA in Journalism from NYU and a BA in International Relations from Colgate University. Follow Bertoni for continued coverage of startups, investing, billionaires, the Forbes 30 Under 30, and top creators and influencers. Forbes reporters follow
