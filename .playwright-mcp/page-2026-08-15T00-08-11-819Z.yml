              - paragraph [ref=f20e297]: Over the last few years, Shufelt, 39, and his cofounder, John Walker, 42, have created the buzziest beer brand in America by creating craft brews without the buzz. Alcohol-free beer, often bland and thin, has long been seen as the brewer’s equivalent to decaf coffee or tofu turkey. Athletic Brewing is out to eliminate the stigma, making hoppy IPAs, crisp ales and toasty porters with the flavor and feel of a craft beer—but with less alcohol than a slice of rye bread. A six-pack costs about $10. “Humans have been drinking beer for more than 5,000 years,” says Shufelt, a former hedge fund trader who, a decade ago, gave up booze to improve his market focus. “I’m a beer lover and food lover—it blew my mind that there wasn’t a beer for people living modern, healthy lifestyles.”
              - img "Forbes cover" [ref=f20e302]
              - generic [ref=f20e303]: Franco Vogt for Forbes
              - paragraph [ref=f20e306]: Investors are betting big that millions of drinkers feel the same. Since Shufelt and Walker started tinkering with home-brew equipment in 2017, they have raised a dizzying $173.5 million from Alliance Consumer Growth, TRB Advisors and Tastemaker Capital. In the fall of 2022, Keurig Dr Pepper, the $12.7 billion (sales) beverage giant, took a $50 million minority stake at a valuation just under $500 million, according to sources close to the deal. Celebrity investors including Naomi Osaka, J.J. Watt, Karlie Kloss and Toms Shoes founder Blake Mycoskie have also bellied up to the bar. “I’d never been a fan of nonalcoholic beer—not because it didn’t have alcohol, because it didn’t taste good,” says chef and Momofuku founder David Chang, who has invested in Athletic and carries its beers in his restaurants. “Athletic is breaking the stereotype—one of food’s taboos—and it’s gaining momentum.”
              - paragraph [ref=f20e307]: While traditional U.S. beer sales have been relatively flat for years, the market for boozeless brews is booming, with total revenue up 20% to $330 million between the summers of 2021 and 2022, according to NielsenIQ. Athletic has outpaced the pack. It says 2022 sales grew almost 70%, topping $60 million, compared to $37 million in 2021. (Heineken 0.0 is the market leader with more than 25% of U.S. sales.) “Growth is being driven by people who enjoy alcohol and are interested in health, wellness and great taste,” says Keurig Dr Pepper’s head of strategy, Justin Whitmore.
